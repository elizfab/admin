# PR automático: a cada push em uma branch de trabalho,
#   1. valida o tipo da branch (só feature/* é aceita);
#   2. abre o PR para a develop, se ainda não existir.
# A validação do PR (Danger + CI) NÃO roda aqui: o PR aberto pelo github-actions[bot]
# dispara os workflows "Danger" e "CI" pelo evento pull_request (uma vez cada).
# Antes (T-0006) eles também rodavam aqui, e cada PR era validado duas vezes (T-0020).
name: PR automático

on:
  push:
    branches-ignore: [main, develop]

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validar-branch:
    name: Validar tipo de branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js (versão do .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Conferir se a branch é feature/*
        run: npx tsx scripts/check-branch.ts "$BRANCH"
        env:
          BRANCH: ${{ github.ref_name }}

  abrir-pr:
    name: Abrir PR para a develop
    needs: validar-branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Baixar o código (com histórico, para listar os commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar o PR (se ainda não existe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing já está aberto; nada a fazer." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git fetch --no-tags origin develop
          count=$(git rev-list --count origin/develop..HEAD)
          if [ "$count" -eq 0 ]; then
            echo "A branch não tem commits novos em relação à develop; PR não aberto." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Título: o commit (se for um só) ou o nome da branch.
          if [ "$count" -eq 1 ]; then
            title=$(git log -1 --format=%s)
          else
            title="Feature: $(echo "${BRANCH#feature/}" | tr '-' ' ')"
          fi

          {
            echo "## O que muda"
            echo
            echo "Commits desta branch ($count):"
            echo
            git log --reverse --format='- %s' origin/develop..HEAD
            echo
            echo "## Checklist (Definition of Done)"
            echo
            echo "- [ ] Pipeline verde: typecheck, lint, testes, E2E e integração"
            echo "- [ ] \`WIP.md\` atualizado"
            echo "- [ ] \`docs/CHANGELOG.md\` atualizado"
            echo "- [ ] \`docs/implementations/<módulo>.md\` atualizado (se mudou regra)"
            echo
            echo "> PR aberto automaticamente pelo workflow **PR automático** (push em \`feature/*\`)."
          } > "$RUNNER_TEMP/pr-body.md"

          url=$(gh pr create --base develop --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md")
          echo "PR aberto: $url" | tee -a "$GITHUB_STEP_SUMMARY"

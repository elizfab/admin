# Integração contínua: roda a cada push na main, em todo pull request e
# quando o "PR automático" acaba de abrir um PR (workflow_call).
# Se qualquer etapa falhar, o commit/PR fica marcado com ❌ no GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Chamado pelo "PR automático" logo depois de abrir o PR (veja auto-pr.yml).
  workflow_call:

# Cancela execuções antigas do mesmo branch quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PostgreSQL só para os testes (mesma versão do docker-compose local).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js (versão do .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (gera o Prisma Client no postinstall)
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      # Prettier: recusa arquivo fora do formato (evita diff de indentação nos PRs).
      - name: Formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # O global setup do E2E cria/migra o banco admin_test e as contas de teste.
      - name: Testes E2E
        run: npm run test:e2e

      - name: Testes de integração
        run: npm run test:integration

      - name: Guardar o relatório do Playwright (se algo falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

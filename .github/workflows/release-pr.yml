# PR de release automático: a cada push na develop (merge de uma feature/*),
#   1. abre o PR develop → main, se ainda não existir; se já existe, atualiza a lista do que entra;
#   2. no PR recém-aberto, roda o Danger e a CI.
# Por que o passo 2 fica aqui: PR criado com o GITHUB_TOKEN não dispara outros
# workflows (regra do GitHub contra loops). Nos merges seguintes na develop, o PR
# recebe os commits novos e os workflows "Danger" e "CI" rodam pelo evento pull_request.
# O merge na main continua manual: é a decisão de publicar em produção.
name: PR de release

on:
  push:
    branches: [develop]

concurrency:
  group: release-pr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  abrir-pr:
    name: Abrir/atualizar PR develop → main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      created: ${{ steps.pr.outputs.created }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Baixar o código (com histórico, para listar o que entra)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar ou atualizar o PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin main
          count=$(git rev-list --count origin/main..HEAD)
          if [ "$count" -eq 0 ]; then
            echo "A develop não tem nada novo em relação à main; PR não aberto." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # O que entra: um item por merge/commit direto na develop (sem os commits internos das features).
          {
            echo "## O que entra na produção"
            echo
            git log --first-parent --reverse --format='- %s' origin/main..HEAD
            echo
            echo "## Checklist antes do merge (DevOps)"
            echo
            echo "- [ ] CI e Danger verdes neste PR"
            echo "- [ ] Migrations novas são aditivas (destrutiva: ADR, backup e janela combinada — R15)"
            echo "- [ ] Variáveis novas cadastradas na Vercel (Production e Preview)"
            echo "- [ ] Preview testado nos cenários principais"
            echo "- [ ] \`docs/CHANGELOG.md\`: a seção [Não publicado] vira a data do deploy"
            echo
            echo "> PR mantido automaticamente pelo workflow **PR de release** (push na \`develop\`)."
          } > "$RUNNER_TEMP/pr-body.md"

          existing=$(gh pr list --head develop --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "PR #$existing já aberto; lista do que entra atualizada." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          url=$(gh pr create --base main --head develop --title "Release: develop → main ($(date -u +%Y-%m-%d))" --body-file "$RUNNER_TEMP/pr-body.md")
          echo "PR aberto: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

  danger:
    name: Danger no PR de release
    needs: abrir-pr
    if: needs.abrir-pr.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js (versão do .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      # O Danger lê o PR do arquivo de evento; montamos um evento pull_request
      # com os dados do PR recém-criado.
      - name: Rodar o Danger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.abrir-pr.outputs.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '{pull_request: .}' > "$RUNNER_TEMP/pr-event.json"
          GITHUB_EVENT_NAME=pull_request GITHUB_EVENT_PATH="$RUNNER_TEMP/pr-event.json" npx danger ci --failOnErrors

  ci:
    name: CI no PR de release
    needs: abrir-pr
    if: needs.abrir-pr.outputs.created == 'true'
    uses: ./.github/workflows/ci.yml

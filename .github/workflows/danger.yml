# Danger: revisa todo PR (tipo de branch + lembretes do Definition of Done).
# Regras em dangerfile.ts e scripts/branch-rules.ts.
# O primeiro Danger de um PR aberto pelo "PR automático" roda dentro daquele
# workflow (o GitHub não dispara este evento para PRs criados pelo GITHUB_TOKEN);
# daqui em diante, cada push na branch dispara este workflow normalmente.
name: Danger

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: danger-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  danger:
    name: Danger (regras do PR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js (versão do .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: o Danger não precisa do Prisma Client (mais rápido).
      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Rodar o Danger
        run: npx danger ci --failOnErrors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
